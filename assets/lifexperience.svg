<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
<title id="title">LifeXperience</title><desc id="desc">Ilustración conceptual original del proyecto. Misiones, habilidades y nuevas formas de aprender</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1224"/><stop offset=".55" stop-color="#151333"/><stop offset="1" stop-color="#081D2C"/></linearGradient>
<linearGradient id="accent"><stop stop-color="#A78BFA"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#7C3AED" stop-opacity=".34"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity=".045"/></pattern>
<filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
<style>
text{font-family:'Segoe UI',Arial,sans-serif} .mono{font-family:Consolas,'Courier New',monospace}
.float{animation:float 7s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.85}}
@media(prefers-reduced-motion:reduce){.float,.pulse{animation:none}}
</style><linearGradient id="projectAccent"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<radialGradient id="projectHalo"><stop stop-color="#A78BFA" stop-opacity=".2"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient></defs>
<rect x="1" y="1" width="1198" height="288" rx="22" fill="url(#bg)" stroke="#A78BFA" stroke-opacity=".3"/>
<rect x="2" y="2" width="1196" height="286" rx="22" fill="url(#grid)"/>
<ellipse cx="990" cy="145" rx="235" ry="200" fill="url(#projectHalo)"/>
<rect x="45" y="40" width="5" height="26" rx="2" fill="#A78BFA"/>
<text x="65" y="58" font-size="15" letter-spacing="3" fill="#A78BFA" class="mono">EDTECH / APRENDIZAJE GAMIFICADO</text>
<text x="44" y="139" font-size="54" font-weight="700" letter-spacing="-1.5" fill="#F8FAFC">LifeXperience</text>
<text x="47" y="182" font-size="23" fill="#CBD5E1">Misiones, habilidades y nuevas formas de aprender</text>
<path d="M47 222H600" stroke="url(#projectAccent)" stroke-opacity=".25"/>
<text x="47" y="254" font-size="14" fill="#64748B" class="mono">PROYECTO DESTACADO / sromansilva</text>
<g class="float">
<path d="M822 205L888 172L950 198L998 117L1080 79" fill="none" stroke="#A78BFA" stroke-opacity=".45" stroke-width="2" stroke-dasharray="5 8"/>
<circle cx="822" cy="205" r="16" fill="#182339" stroke="#22D3EE" stroke-width="2"/>
<circle cx="888" cy="172" r="19" fill="#1E1A3A" stroke="#A78BFA" stroke-width="2"/>
<circle cx="950" cy="198" r="14" fill="#172539" stroke="#22D3EE" stroke-width="2"/>
<circle cx="998" cy="117" r="32" fill="#251D43" stroke="#A78BFA" stroke-width="2"/>
<path d="M996 97L984 121H996L990 137L1014 110H1001L1007 97Z" fill="#C4B5FD"/>
<circle cx="1080" cy="79" r="17" fill="#182A3A" stroke="#22D3EE" stroke-width="2"/>
<circle r="5" fill="#22D3EE"><animateMotion path="M822 205L888 172L950 198L998 117L1080 79" dur="7s" repeatCount="indefinite"/></circle>
<text x="1079" y="232" font-size="18" text-anchor="end" fill="#A78BFA" class="mono">LEARN → LEVEL UP</text>
</g>
</svg>
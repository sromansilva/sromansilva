<rect x="45" y="40" width="5" height="26" rx="2" fill="#22D3EE"/>
<text x="65" y="58" font-size="15" letter-spacing="3" fill="#22D3EE" class="mono">FINANZAS / PROYECTO EN EQUIPO</text>
<text x="44" y="139" font-size="54" font-weight="700" letter-spacing="-1.5" fill="#F8FAFC">Chapa Tu Cambio</text>
